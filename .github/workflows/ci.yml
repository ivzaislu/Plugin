name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

  ninepeso:
    name: 9peso Python builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s test -p "test_ninepeso*.py" -v
      - name: Validate the imported large 9peso catalog
        run: |
          python -c "from builder.ninepeso_catalog import load_catalog, CATALOG; db=load_catalog(CATALOG); print('movies', len(db['movies']), 'series', len(db['tv_series']))"
