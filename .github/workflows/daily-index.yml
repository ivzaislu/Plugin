name: Build TMDB collections index (daily)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-index.yml"

permissions:
  contents: write

concurrency:
  group: tmdb-index
  cancel-in-progress: true

jobs:
  dry-run:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run full 180-page 200-vote TMDB dry run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Full 180-page 200-vote dry run
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_LANG: ru-RU
        run: node builder/build-index.js --pages 180 --yearPages 0 --yearAltPages 0 --max 3500 --delay 100 --voteCountGte 200 --minPartVoteCount 10 --minQualifiedParts 2

      - name: Show dry-run totals
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/collectionsIndex.json', 'utf8'));
          console.log(`DRY_RUN_TOTAL=${d.total}`);
          console.log(`DRY_RUN_ADDED=${d.meta?.added_now ?? 'n/a'}`);
          console.log(`DRY_RUN_REJECTED_LOW_QUALITY=${d.meta?.collections_rejected_low_quality ?? 'n/a'}`);
          console.log(`DRY_RUN_MOVIES=${d.meta?.unique_movies_checked ?? 'n/a'}`);
          console.log(`DRY_RUN_PAGES=${d.meta?.discovery_pages_scanned ?? 'n/a'}`);
          console.log(`DRY_RUN_API_REQUESTS=${d.meta?.api_requests ?? 'n/a'}`);
          NODE

  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build index
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_LANG: ru-RU
        run: node builder/build-index.js --pages 180 --yearPages 0 --yearAltPages 0 --max 3500 --delay 100 --voteCountGte 200 --minPartVoteCount 10 --minQualifiedParts 2

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/collectionsIndex.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update collections index"
          git push
