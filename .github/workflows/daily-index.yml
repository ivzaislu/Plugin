name: Build TMDB collections index (daily)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: tmdb-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build index
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_LANG: ru-RU
        run: node builder/build-index.js --pages 180 --yearPages 2 --yearAltPages 0 --fromYear 1978 --max 3500 --delay 100 --voteCountGte 100 --yearVoteCountGte 25 --minPartVoteCount 10 --minQualifiedParts 2

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/collectionsIndex.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update collections index"
          git push
